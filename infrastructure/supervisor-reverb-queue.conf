[program:pedido-feito-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pedido-feito/artisan queue:work --queue=printing,default --sleep=3 --tries=3
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pedido-feito/storage/logs/queue-worker.log
stopwaitsecs=3600

[program:pedido-feito-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pedido-feito/artisan reverb:start --host="127.0.0.1" --port=8080
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/pedido-feito/storage/logs/reverb.log
stopwaitsecs=3600
